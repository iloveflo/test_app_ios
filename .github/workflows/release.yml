name: Flutter CD

on:
  push:
    tags: ["v*.*.*"]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS release
    needs: quality
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ipa --release --no-codesign

      - name: List iOS build output
        if: always()
        run: |
          echo "=== build/ios/archive ==="
          ls -lah build/ios/archive || true

      - name: Upload release iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive-${{ github.ref_name }}
          path: build/ios/archive/*.xcarchive
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: release/android

      - name: Download iOS archive
        uses: actions/download-artifact@v4
        with:
          name: ios-release-archive-${{ github.ref_name }}
          path: release/ios

      - name: List release files
        run: |
          find release -maxdepth 4 -type f -print

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/android/app-release.apk
          generate_release_notes: true