name: Flutter CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source code
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-android:
    name: Build Android APK
    needs: quality-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS
    needs: quality-and-test

    # macOS is required for Flutter iOS builds.
    # macos-26 includes Xcode and iOS tooling.
    runs-on: macos-26

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ipa --release --no-codesign

      - name: List iOS build output
        if: always()
        run: |
          echo "=== build/ios/ipa ==="
          ls -lah build/ios/ipa || true

          echo "=== build/ios/archive ==="
          ls -lah build/ios/archive || true

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/ios/archive/*.xcarchive
          if-no-files-found: error
          retention-days: 14